<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>تقرير الجولة - دوري دراية</title>
<link rel="stylesheet" href="../assets/css/theme.css"/>
<link rel="stylesheet" href="../assets/css/components.css"/>
<style>
  #adminTabs{ display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px; }
  .picker{ display:flex;gap:8px;align-items:center;margin-bottom:14px; }
  .picker select{ flex:1; }
  #previewWrap{ margin-top:6px; }
  #previewImg{ width:100%;display:block;border-radius:var(--radius);border:1px solid var(--border); }
  .status{ text-align:center;color:var(--text2);font-size:13px;padding:30px 0; }

  /* ===== البطاقة اللي تتحول لصورة — مقاس ثابت 1080 عشان تطلع نفس الجودة دايمًا ===== */
  #stage{ position:fixed;left:-20000px;top:0;width:1080px; }
  .rp{
    --navy:#12304f; --navy2:#0c2038; --gold:#c99a2e; --gold-soft:#fbf1d3;
    --ink:#14233a; --mute:#66778f; --card:#ffffff; --line:#e3e8ef; --bg:#f4f6f9;
    --up:#14a05a; --down:#d9473d;
    width:1080px;direction:rtl;color:var(--ink);background:var(--bg);
    font-family:'Thmanyah','Tajawal',serif;position:relative;overflow:hidden;
  }
  .rp *{ box-sizing:border-box;margin:0;padding:0; }

  /* الترويسة */
  .rp-head{ background:linear-gradient(135deg,#1b4170 0%,var(--navy) 45%,var(--navy2) 100%);padding:54px 56px 50px;position:relative; }
  .rp-head::after{ content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:linear-gradient(90deg,#8f6a14,var(--gold),#f0d27a,var(--gold),#8f6a14); }
  .rp-head-row{ display:flex;justify-content:space-between;align-items:center; }
  .rp-eyebrow{ color:#f0d27a;font-weight:800;font-size:28px;margin-bottom:10px; }
  .rp-title{ font-family:'Thmanyah','Tajawal',serif;font-weight:900;font-size:96px;line-height:1.15;color:#fff; }
  .rp-title b{ color:#f0d27a;font-weight:900; }
  .rp-date{ color:#c4d3e6;font-size:26px;margin-top:16px; }
  .rp-logo{ background:#fff;border-radius:22px;padding:14px 20px;display:flex;align-items:center; }
  .rp-logo img{ height:64px;display:block; }

  .rp-body{ padding:44px 56px 40px; }
  .rp-sec{ margin-bottom:46px; }
  .rp-h{ font-family:'Thmanyah','Tajawal',serif;font-weight:900;font-size:44px;color:var(--navy);margin-bottom:22px;display:flex;align-items:center;gap:14px; }
  .rp-h i{ display:inline-block;width:10px;height:42px;border-radius:5px;background:var(--gold); }

  /* النتائج الحماسية */
  .m-card{ background:var(--card);border-radius:28px;padding:30px 32px 28px;margin-bottom:20px;border:1px solid var(--line);box-shadow:0 10px 26px -14px rgba(18,48,79,.35); }
  .m-shout{ font-family:'Thmanyah','Tajawal',serif;font-weight:900;font-size:40px;line-height:1.5;color:var(--navy);margin-bottom:22px; }
  .m-shout .w{ color:var(--gold); }
  .m-shout .l{ color:var(--down); }
  .m-teams{ display:flex;gap:16px; }
  .m-team{ flex:1;display:flex;align-items:center;gap:16px;border-radius:20px;padding:14px 16px;background:var(--bg);border:3px solid transparent; }
  .m-team.win{ background:var(--gold-soft);border-color:var(--gold); }
  .crest{ width:74px;height:74px;border-radius:20px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Thmanyah','Tajawal',serif;font-weight:900;font-size:36px;color:#fff;overflow:hidden; }
  .crest img{ width:100%;height:100%;object-fit:cover;display:block; }
  .m-team .nm{ font-weight:800;font-size:30px;line-height:1.3; }
  .m-team .bal{ font-size:23px;color:var(--mute);margin-top:4px; }
  .m-team .bal b{ font-family:'Thmanyah','Tajawal',serif;font-weight:900;font-size:34px;color:var(--ink); }
  .m-wait{ font-weight:800;font-size:32px;color:var(--mute);text-align:center;padding:10px 0; }

  /* أعلى الصفقات */
  .d-row{ display:flex;align-items:center;gap:20px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px 26px;margin-bottom:14px;box-shadow:0 8px 20px -14px rgba(18,48,79,.35); }
  .d-rank{ width:62px;height:62px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Thmanyah','Tajawal',serif;font-weight:900;font-size:32px;background:var(--navy);color:#fff; }
  .d-row.r1 .d-rank{ background:var(--gold);color:#241b00; }
  .d-info{ flex:1;min-width:0; }
  .d-player{ font-weight:900;font-size:34px;line-height:1.3; }
  .d-route{ font-size:24px;color:var(--mute);margin-top:6px; }
  .d-route b{ color:var(--ink);font-weight:800; }
  .d-amt{ font-family:'Thmanyah','Tajawal',serif;font-weight:900;font-size:50px;color:var(--navy);flex-shrink:0; }
  .d-amt small{ font-family:'Thmanyah','Tajawal',serif;font-size:22px;font-weight:700;color:var(--mute);margin-inline-start:6px; }

  /* الترتيب */
  .t-row{ display:flex;align-items:center;gap:18px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px 24px;margin-bottom:12px; }
  .t-row.first{ background:var(--gold-soft);border-color:var(--gold);border-width:3px; }
  .t-rank{ width:52px;height:52px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-family:'Thmanyah','Tajawal',serif;font-weight:900;font-size:28px;flex-shrink:0; }
  .t-row.first .t-rank{ background:var(--gold);color:#241b00; }
  .t-crest{ width:58px;height:58px;border-radius:16px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:28px;color:#fff;overflow:hidden; }
  .t-crest img{ width:100%;height:100%;object-fit:cover;display:block; }
  .t-name{ font-weight:900;font-size:33px;flex:1;min-width:0; }
  .t-wins{ background:var(--navy);color:#fff;font-weight:800;font-size:24px;border-radius:999px;padding:5px 18px;margin-inline-start:12px;white-space:nowrap; }
  .t-move{ font-weight:800;font-size:24px;min-width:70px;text-align:center; }
  .t-move.up{ color:var(--up); } .t-move.down{ color:var(--down); } .t-move.flat{ color:#aab6c6; }
  .t-bal{ font-family:'Thmanyah','Tajawal',serif;font-weight:900;font-size:40px;color:var(--navy);min-width:150px;text-align:left; }
  .l-empty{ color:var(--mute);font-size:28px;text-align:center;padding:20px; }

  .rp-foot{ background:var(--navy2);color:#c4d3e6;display:flex;justify-content:space-between;align-items:center;padding:26px 56px;font-size:24px; }
  .rp-foot b{ color:#f0d27a;font-weight:800; }
</style>
</head>
<body>
<header id="appHeader"></header>
<main class="container">
  <div id="adminTabs"></div>

  <div class="picker">
    <select class="field" id="roundSelect" onchange="onRoundChange()"></select>
    <button class="btn primary" id="dlBtn" onclick="onDownload()" disabled>تنزيل كصورة</button>
  </div>

  <div id="previewWrap"><div class="status" id="statusMsg">جارٍ تجهيز التقرير...</div></div>
</main>

<div id="stage"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="../js/supabaseClient.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui/toast.js"></script>
<script src="../js/ui/theme.js"></script>
<script src="../js/ui/adminNav.js"></script>
<script src="../js/api/teams.js"></script>
<script src="../js/api/players.js"></script>
<script src="../js/api/matches.js"></script>
<script>
let weeks = [], teamsById = {}, playersById = {}, allMatches = [];
let currentWeek = null, lastBlob = null, renderToken = 0;

const nf = (n) => Number(n).toLocaleString("en-US");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const fmtDate = (d) => new Date(d).toLocaleDateString("ar", { day: "numeric", month: "long", year: "numeric", calendar: "gregory" });

function crest(team, cls){
  // أسماء الفرق تبدأ بـ "ال" فكلها تطلع "ا" — نأخذ أول حرف بعدها
  const initial = esc((team?.name || "؟").replace(/^ال/, "").slice(0, 1));
  const bg = team?.primary_color || "#334155";
  if(team?.logo_url){
    return `<div class="${cls}" style="background:${bg}"><img src="${esc(team.logo_url)}" crossorigin="anonymous" alt=""
      onerror="this.remove();this.parentNode&&(this.parentNode.textContent='${initial}')"/></div>`;
  }
  return `<div class="${cls}" style="background:${bg}">${initial}</div>`;
}

async function fetchRoundData(week){
  const matches = allMatches.filter(m => m.week_id === week.id);
  const ids = matches.map(m => m.id);
  const done = matches.filter(m => m.status === "completed");
  const lastAt = done.map(m => m.confirmed_at).filter(Boolean).sort().pop() || null;

  const [loansRes, roundLedger, laterLedger] = await Promise.all([
    ids.length ? sb.from("match_loans").select("*").in("match_id", ids) : { data: [] },
    ids.length ? sb.from("balance_ledger").select("team_id, delta").in("match_id", ids) : { data: [] },
    lastAt ? sb.from("balance_ledger").select("team_id, delta").gt("created_at", lastAt) : { data: [] },
  ]);
  for(const r of [loansRes, roundLedger, laterLedger]) if(r.error) throw r.error;
  return { matches, done, lastAt, loans: loansRes.data, roundLedger: roundLedger.data, laterLedger: laterLedger.data };
}

// الرصيد بعد الجولة = الرصيد الحالي ناقص أي حركة صارت بعدها؛ وقبلها = بعدها ناقص حركات هذي الجولة
function computeStandings(data){
  const sum = (rows) => rows.reduce((acc, r) => (acc[r.team_id] = (acc[r.team_id] || 0) + r.delta, acc), {});
  const later = sum(data.laterLedger), inRound = sum(data.roundLedger);
  // عدد مرات الفوز لين نهاية هذي الجولة
  const wins = {};
  allMatches.forEach(m => {
    if(m.status !== "completed" || !m.winner_team_id) return;
    if(data.lastAt && m.confirmed_at && m.confirmed_at > data.lastAt) return;
    wins[m.winner_team_id] = (wins[m.winner_team_id] || 0) + 1;
  });
  const rows = Object.values(teamsById).map(t => {
    const after = t.balance_daraya - (later[t.id] || 0);
    return { team: t, after, before: after - (inRound[t.id] || 0), wins: wins[t.id] || 0 };
  });
  const rank = (key) => {
    const sorted = [...rows].sort((a, b) => b[key] - a[key] || a.team.name.localeCompare(b.team.name, "ar"));
    sorted.forEach((r, i) => r[key === "after" ? "rankAfter" : "rankBefore"] = i + 1);
  };
  rank("after"); rank("before");
  return rows.sort((a, b) => a.rankAfter - b.rankAfter);
}

// عبارات حماسية — W الفائز، L الخاسر
const SHOUTS = [
  (W, L) => `تم سحق ${L} من قبل ${W}`,
  (W, L) => `تم دعس ${L} من قبل ${W}`,
  (W, L) => `${W} يكتسح ${L} اكتساحًا`,
  (W, L) => `تم تحطيم ${L} على يد ${W}`,
  (W, L) => `${W} يلقّن ${L} درسًا قاسيًا`,
  (W, L) => `تم إسقاط ${L} من قبل ${W}`,
];
function shoutHtml(i, W, L){
  // نركّب الجملة بأسماء مؤقتة ثم نلوّن الاسمين
  const raw = SHOUTS[i % SHOUTS.length]("\u0001W\u0001", "\u0001L\u0001");
  return esc(raw).replace("\u0001W\u0001", `<span class="w">${esc(W)}</span>`).replace("\u0001L\u0001", `<span class="l">${esc(L)}</span>`);
}

function reportHtml(week, data){
  const { matches, done, loans } = data;
  const standings = computeStandings(data);
  const dates = done.map(m => m.confirmed_at).filter(Boolean).sort();
  const dateText = dates.length ? fmtDate(dates[dates.length - 1]) : "";

  const teamBlock = (id, bal, win) => `
    <div class="m-team ${win ? 'win' : ''}">
      ${crest(teamsById[id], "crest")}
      <div><div class="nm">${esc(teamsById[id]?.name)}</div>
      <div class="bal">الرصيد <b>${nf(bal)}</b></div></div>
    </div>`;

  let shoutIdx = 0;
  const matchesHtml = matches.map(m => {
    if(m.status !== "completed"){
      return `<div class="m-card"><div class="m-wait">بانتظار ${esc(teamsById[m.team_a_id]?.name)} × ${esc(teamsById[m.team_b_id]?.name)}</div></div>`;
    }
    const aWon = m.winner_team_id === m.team_a_id;
    const winId = aWon ? m.team_a_id : m.team_b_id, loseId = aWon ? m.team_b_id : m.team_a_id;
    const winBal = aWon ? m.team_a_balance_after : m.team_b_balance_after;
    const loseBal = aWon ? m.team_b_balance_after : m.team_a_balance_after;
    return `
      <div class="m-card">
        <div class="m-shout">${shoutHtml(shoutIdx++, teamsById[winId]?.name, teamsById[loseId]?.name)}</div>
        <div class="m-teams">${teamBlock(winId, winBal, true)}${teamBlock(loseId, loseBal, false)}</div>
      </div>`;
  }).join("");

  const top3 = [...loans].sort((x, y) => y.winning_bid_amount - x.winning_bid_amount).slice(0, 3);
  const dealsHtml = top3.length ? top3.map((l, i) => `
      <div class="d-row r${i + 1}">
        <div class="d-rank">${i + 1}</div>
        <div class="d-info">
          <div class="d-player">${esc(playersById[l.player_id]?.full_name)}</div>
          <div class="d-route">من <b>${esc(teamsById[l.original_team_id]?.name)}</b> إلى <b>${esc(teamsById[l.borrowing_team_id]?.name)}</b></div>
        </div>
        <div class="d-amt">${nf(l.winning_bid_amount)}<small>دراية</small></div>
      </div>`).join("") : `<div class="l-empty">ما فيه تعاقدات بهذي الجولة</div>`;

  const standingsHtml = standings.map(r => {
    const move = r.rankBefore - r.rankAfter;
    return `
      <div class="t-row ${r.rankAfter === 1 ? 'first' : ''}">
        <div class="t-rank">${r.rankAfter}</div>
        ${crest(r.team, "t-crest")}
        <div class="t-name">${esc(r.team.name)}<span class="t-wins">ف ${r.wins}</span></div>
        <div class="t-move ${move > 0 ? 'up' : move < 0 ? 'down' : 'flat'}">${move > 0 ? '▲ ' + move : move < 0 ? '▼ ' + Math.abs(move) : '—'}</div>
        <div class="t-bal">${nf(r.after)}</div>
      </div>`;
  }).join("");

  return `
  <div class="rp" id="reportCard">
    <div class="rp-head">
      <div class="rp-head-row">
        <div>
          <div class="rp-eyebrow">دوري دراية</div>
          <div class="rp-title">تقرير <b>الجولة ${week.week_number}</b></div>
          ${dateText ? `<div class="rp-date">${dateText}</div>` : ""}
        </div>
        <div class="rp-logo"><img src="../assets/daraya-logo-light.png" alt="مجموعة دراية"/></div>
      </div>
    </div>
    <div class="rp-body">
      <div class="rp-sec"><div class="rp-h"><i></i>نتائج الجولة</div>${matchesHtml || '<div class="l-empty">ما فيه مباريات بهذي الجولة</div>'}</div>
      <div class="rp-sec"><div class="rp-h"><i></i>أعلى 3 صفقات</div>${dealsHtml}</div>
      <div class="rp-sec" style="margin-bottom:0;"><div class="rp-h"><i></i>الترتيب</div>${standingsHtml}</div>
    </div>
    <div class="rp-foot"><span>مجموعة <b>دراية</b></span><span>دوري دراية · الجولة ${week.week_number}</span></div>
  </div>`;
}

async function waitForAssets(root){
  const imgs = [...root.querySelectorAll("img")];
  await Promise.all(imgs.map(img => img.complete ? null : new Promise(res => { img.onload = img.onerror = res; })));
  if(document.fonts && document.fonts.ready) await document.fonts.ready;
}

async function buildReport(){
  const token = ++renderToken;
  const status = document.getElementById("statusMsg");
  const wrap = document.getElementById("previewWrap");
  const btn = document.getElementById("dlBtn");
  btn.disabled = true; lastBlob = null;
  wrap.innerHTML = `<div class="status">جارٍ تجهيز التقرير...</div>`;
  try{
    const data = await fetchRoundData(currentWeek);
    if(token !== renderToken) return;
    const stage = document.getElementById("stage");
    stage.innerHTML = reportHtml(currentWeek, data);
    const card = document.getElementById("reportCard");
    await waitForAssets(card);
    const canvas = await html2canvas(card, { scale: 2, useCORS: true, backgroundColor: "#f4f6f9", logging: false, windowWidth: 1080 });
    if(token !== renderToken) return;
    lastBlob = await new Promise(res => canvas.toBlob(res, "image/png"));
    wrap.innerHTML = `<img id="previewImg" alt="تقرير الجولة ${currentWeek.week_number}" src="${canvas.toDataURL("image/png")}"/>`;
    btn.disabled = false;
  }catch(err){
    wrap.innerHTML = `<div class="status" style="color:var(--red);">تعذّر تجهيز التقرير: ${esc(err.message)}</div>`;
  }
}

function onRoundChange(){
  currentWeek = weeks.find(w => w.id === document.getElementById("roundSelect").value);
  buildReport();
}

function onDownload(){
  if(!lastBlob) return;
  const url = URL.createObjectURL(lastBlob);
  const a = document.createElement("a");
  a.href = url; a.download = `تقرير-الجولة-${currentWeek.week_number}.png`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  showToast("تم تنزيل الصورة", "success");
}

(async function(){
  const profile = await requireAuth({ adminOnly: true });
  if(!profile) return;
  renderAdminNav("report");

  try{
    const [w, teams, players, matches] = await Promise.all([listWeeks(), listTeams(), listPlayers(), listMatches()]);
    weeks = w; allMatches = matches;
    teamsById = Object.fromEntries(teams.map(t => [t.id, t]));
    playersById = Object.fromEntries(players.map(p => [p.id, p]));

    const withResults = new Set(matches.filter(m => m.status === "completed").map(m => m.week_id));
    const roundsWithMatches = weeks.filter(wk => matches.some(m => m.week_id === wk.id));
    const sel = document.getElementById("roundSelect");
    sel.innerHTML = roundsWithMatches.map(wk => `<option value="${wk.id}">الجولة ${wk.week_number}${withResults.has(wk.id) ? '' : ' (لم تُلعب بعد)'}</option>`).join("");
    const latestDone = [...roundsWithMatches].reverse().find(wk => withResults.has(wk.id)) || roundsWithMatches[roundsWithMatches.length - 1];
    if(!latestDone){ document.getElementById("previewWrap").innerHTML = `<div class="status">ما فيه جولات بها مباريات بعد</div>`; return; }
    sel.value = latestDone.id;
    onRoundChange();
  }catch(err){
    document.getElementById("previewWrap").innerHTML = `<div class="status" style="color:var(--red);">${esc(err.message)}</div>`;
  }
})();
</script>
</body>
</html>
