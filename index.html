<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>دوري دراية</title>
<link rel="stylesheet" href="assets/css/theme.css"/>
<link rel="stylesheet" href="assets/css/components.css"/>
<style>
  /* ====== شاشة الدخول (كشف شعار مجموعة درايه تسلسليًا) ====== */
  #splash{
    position:fixed;inset:0;z-index:9999;
    display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(60% 50% at 50% 42%, color-mix(in srgb, var(--gold) 14%, transparent), transparent 70%),
      radial-gradient(70% 60% at 50% 105%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 70%),
      var(--bg);
    opacity:1;transition:opacity .9s cubic-bezier(.33,0,.2,1), visibility .9s cubic-bezier(.33,0,.2,1);
    cursor:pointer;
  }
  #splash.hide{opacity:0;visibility:hidden;pointer-events:none;}
  .sp-logo-svg{ width:150px;height:auto;filter:drop-shadow(0 0 26px color-mix(in srgb, var(--gold) 42%, transparent)); }
  .sp-logo-svg svg{ width:100%;height:auto;display:block;overflow:visible; }
  .daraya-logo .st0{ fill:var(--gold); }
  .daraya-logo .st1{ fill:var(--text); }
  .daraya-logo .rv{ opacity:0;transform:translateY(7px) scale(.975);transform-origin:center;transform-box:fill-box; }
  #splash .daraya-logo .rv{ animation:rvReveal 1.25s cubic-bezier(.16,1,.3,1) forwards;animation-delay:calc(var(--o,1) * .13s); }
  @keyframes rvReveal{ to{ opacity:1;transform:translateY(0) scale(1); } }
  #splash .daraya-logo .gold-finale{
    animation:rvReveal 1.6s cubic-bezier(.16,1,.3,1) forwards, goldGlow 2.6s cubic-bezier(.33,0,.2,1);
    animation-delay:calc(var(--o,1) * .13s);
  }
  @keyframes goldGlow{
    0%{ filter:drop-shadow(0 0 0 transparent); }
    45%{ filter:drop-shadow(0 0 9px color-mix(in srgb, var(--gold) 60%, transparent)); }
    100%{ filter:drop-shadow(0 0 0 transparent); }
  }
  .sp-tagline{ margin-top:18px;text-align:center; }
  .sp-line{
    width:0;height:1.5px;margin:0 auto 10px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
    animation:spLineGrow 1.4s cubic-bezier(.16,1,.3,1) 1.6s forwards;
  }
  @keyframes spLineGrow{ to{ width:120px; } }
  .sp-sub{
    font-size:15px;font-weight:800;color:var(--text);letter-spacing:.5px;
    opacity:0;animation:spSubIn 1.2s ease 1.9s forwards;
  }
  @keyframes spSubIn{ to{ opacity:1; } }
  @media (prefers-reduced-motion:reduce){
    .daraya-logo .rv, #splash .daraya-logo .gold-finale{ animation:none!important;opacity:1!important;transform:none!important; }
    .sp-line{ animation:none!important;width:120px!important; }
    .sp-sub{ animation:none!important;opacity:1!important; }
  }

  /* ====== الصفحة الرئيسية ====== */
  .landing-wrap{ min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px; }
  .landing-emoji{ font-size:56px;margin-bottom:10px; }
  .landing-wrap h1{ font-size:26px;font-weight:800;margin-bottom:4px; }
  .landing-wrap p{ font-size:14px;color:var(--text2);margin-bottom:32px; }
  .entry-grid{ width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px; }
  .entry-btn{
    display:flex;align-items:center;gap:14px;padding:18px 20px;border-radius:var(--radius-lg);
    text-decoration:none;color:var(--text);
  }
  .entry-btn .icon{ font-size:28px;flex-shrink:0; }
  .entry-btn .label{ font-weight:800;font-size:15px; }
  .entry-btn .sub{ font-size:11px;color:var(--text2);margin-top:2px; }
  .entry-btn.primary-entry{
    background:linear-gradient(135deg, var(--accent), var(--accent2));color:#fff;border:1px solid var(--gold);
    box-shadow:0 12px 28px -10px rgba(26,58,92,.5);
  }
  .entry-btn.primary-entry .sub{ color:rgba(255,255,255,.75); }
  .entry-btn:active{ transform:scale(.97); }

  @keyframes fadeSlideUp{
    from{ opacity:0; transform:translateY(18px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .landing-wrap h1, .landing-wrap p, .entry-grid .entry-btn{ opacity:0; }
  #landingWrap.reveal h1{ animation: fadeSlideUp .6s ease 0s both; }
  #landingWrap.reveal p{ animation: fadeSlideUp .6s ease .1s both; }
  #landingWrap.reveal .entry-grid .entry-btn{ animation: fadeSlideUp .55s ease both; }
  #landingWrap.reveal .entry-grid .entry-btn:nth-child(1){ animation-delay:.2s; }
  #landingWrap.reveal .entry-grid .entry-btn:nth-child(2){ animation-delay:.3s; }
  #landingWrap.reveal .entry-grid .entry-btn:nth-child(3){ animation-delay:.4s; }
  @media (prefers-reduced-motion:reduce){
    .landing-wrap h1, .landing-wrap p, .entry-grid .entry-btn{ animation:none !important; opacity:1 !important; }
  }
</style>
</head>

<div class="landing-wrap" id="landingWrap">
  <div class="landing-emoji">🏆</div>
  <h1>دوري دراية</h1>
  <p>اختر طريقة الدخول</p>

  <div class="entry-grid">
    <a href="standings.html" class="entry-btn primary-entry glass">
      <span class="icon">🏐</span>
      <div><div class="label">متابعة الدوري</div><div class="sub">الترتيب والمباريات — بدون تسجيل دخول</div></div>
    </a>
    <a href="login.html?as=captain" class="entry-btn glass">
      <span class="icon">🎽</span>
      <div><div class="label">دخول الكباتن</div><div class="sub">لإدارة فريقك وصفقاته</div></div>
    </a>
    <a href="login.html?as=admin" class="entry-btn glass">
      <span class="icon">👑</span>
      <div><div class="label">دخول الإدارة</div><div class="sub">لوحة التحكم الكاملة بالدوري</div></div>
    </a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui/theme.js"></script>
<script>
(async function(){
  const session = await getSession();
  if(session){ window.location.replace("standings.html"); return; }

  const splash = document.getElementById("splash");
  const landingWrap = document.getElementById("landingWrap");
  let dismissed = false;

  function dismissSplash(){
    if(dismissed) return;
    dismissed = true;
    splash.classList.add("hide");
    landingWrap.classList.add("reveal");
  }

  splash.addEventListener("click", dismissSplash);
  setTimeout(dismissSplash, 3200);
})();
</script>
